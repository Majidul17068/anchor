name: build

# Builds Anchor for macOS, Windows and Linux.
# * Push a version tag (v*) -> installers are attached to a GitHub Release.
# * Run manually (Actions -> build -> Run workflow) -> installers as run artifacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "22"
  WAILS_VERSION: "v2.17.1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
          - os: macos-latest
            platform: darwin/universal
          - os: windows-latest
            platform: windows/amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install NSIS (Windows installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "C:\Program Files (x86)\NSIS\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (Linux)
        if: runner.os == 'Linux'
        env:
          ANCHOR_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          wails build -platform linux/amd64 -tags webkit2_41 -clean \
            -ldflags "-s -w -X main.Version=${ANCHOR_VERSION} -X github.com/Majidul17068/anchor/internal/drive.BuildClientID=${{ secrets.ANCHOR_GOOGLE_CLIENT_ID }} -X github.com/Majidul17068/anchor/internal/drive.BuildClientSecret=${{ secrets.ANCHOR_GOOGLE_CLIENT_SECRET }}"
          go build -ldflags "-s -w -X main.Version=${ANCHOR_VERSION}" -o build/bin/anchorctl ./cmd/anchorctl
          mkdir -p dist
          ls -la build/bin
          tar -C build/bin -czf dist/anchor-linux-amd64.tar.gz Anchor anchorctl

      # Developer ID signing + notarization run only when the Apple secrets
      # exist. Without them the app is ad-hoc signed and Gatekeeper warns
      # (see README "Signing and notarization").
      - name: Import Developer ID certificate (macOS)
        if: runner.os == 'macOS'
        id: cert
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_P12" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::APPLE_CERTIFICATE_P12 is not set; the macOS build will be ad-hoc signed and Gatekeeper will warn."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/anchor.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        env:
          ANCHOR_VERSION: ${{ steps.ver.outputs.version }}
          SIGNED: ${{ steps.cert.outputs.signed }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          wails build -platform darwin/universal -clean \
            -ldflags "-s -w -X main.Version=${ANCHOR_VERSION} -X github.com/Majidul17068/anchor/internal/drive.BuildClientID=${{ secrets.ANCHOR_GOOGLE_CLIENT_ID }} -X github.com/Majidul17068/anchor/internal/drive.BuildClientSecret=${{ secrets.ANCHOR_GOOGLE_CLIENT_SECRET }}"
          GOARCH=arm64 go build -ldflags "-s -w -X main.Version=${ANCHOR_VERSION}" -o build/bin/anchorctl-arm64 ./cmd/anchorctl
          GOARCH=amd64 go build -ldflags "-s -w -X main.Version=${ANCHOR_VERSION}" -o build/bin/anchorctl-amd64 ./cmd/anchorctl
          lipo -create -output build/bin/anchorctl build/bin/anchorctl-arm64 build/bin/anchorctl-amd64
          mkdir -p dist
          APP=$(ls -d build/bin/*.app | head -1)
          xattr -cr "$APP"
          if [ "$SIGNED" = "true" ]; then
            codesign --force --deep --timestamp --options runtime \
              --entitlements build/darwin/entitlements.plist \
              --sign "$APPLE_SIGNING_IDENTITY" "$APP"
            codesign --force --timestamp --options runtime --sign "$APPLE_SIGNING_IDENTITY" build/bin/anchorctl
          else
            codesign --force --deep --sign - "$APP"
          fi
          codesign --verify --deep --strict "$APP"
          # Disk image with the app and an Applications shortcut for drag-and-drop install.
          STAGE=$(mktemp -d)
          ditto "$APP" "$STAGE/Anchor.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname Anchor -srcfolder "$STAGE" -ov -format UDZO dist/anchor-macos-universal.dmg
          cp build/bin/anchorctl dist/anchorctl-macos-universal
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Notarize (macOS)
        if: runner.os == 'macOS' && steps.cert.outputs.signed == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit dist/anchor-macos-universal.dmg \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dist/anchor-macos-universal.dmg
          # The ticket covers the app inside the image too; staple it so the
          # zip works offline as well.
          xcrun stapler staple "$APP"
          spctl --assess --type execute --verbose=2 "$APP"

      - name: Package app zip (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "$APP" dist/anchor-macos-universal.zip

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          ANCHOR_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          wails build -platform windows/amd64 -nsis -clean \
            -ldflags "-s -w -X main.Version=${ANCHOR_VERSION} -X github.com/Majidul17068/anchor/internal/drive.BuildClientID=${{ secrets.ANCHOR_GOOGLE_CLIENT_ID }} -X github.com/Majidul17068/anchor/internal/drive.BuildClientSecret=${{ secrets.ANCHOR_GOOGLE_CLIENT_SECRET }}"
          go build -ldflags "-s -w -X main.Version=${ANCHOR_VERSION}" -o build/bin/anchorctl.exe ./cmd/anchorctl
          mkdir -p dist
          ls -la build/bin
          cp build/bin/anchorctl.exe dist/anchorctl-windows-amd64.exe
          cp "$(ls build/bin/*.exe | grep -v -i installer | grep -v anchorctl | head -1)" dist/anchor-windows-amd64.exe
          INSTALLER=$(ls build/bin/*installer*.exe 2>/dev/null | head -1 || true)
          if [ -n "$INSTALLER" ]; then
            cp "$INSTALLER" dist/anchor-windows-amd64-setup.exe
          else
            echo "::error::NSIS installer was not produced (makensis missing on PATH)"
            exit 1
          fi

      - name: Upload run artifact
        uses: actions/upload-artifact@v4
        with:
          name: anchor-${{ runner.os }}
          if-no-files-found: error
          path: dist/*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
